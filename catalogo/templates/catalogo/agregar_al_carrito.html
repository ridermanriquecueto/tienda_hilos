
{% load product_image_tags %}
<div class="producto">
    <h2>{{ producto.nombre }}</h2>
    <img src="{{ producto|product_image }}" alt="{{ producto.nombre }}" />
    <p>Precio: ${{ producto.precio }}</p>
    <form action="{% url 'catalogo:agregar_al_carrito' producto.id %}" method="post">
        {% csrf_token %}
        <input type="number" name="cantidad" value="1" min="1" max="{{ producto.stock }}">
        <button type="submit">Agregar al Carrito</button>
    </form>
    
    
    <a href="{% url 'catalogo:detalle_producto' producto.id %}">Ver Detalles</a>
     
    
    <div class="mt-3">
        <a href="{% url 'catalogo:catalogo' %}" class="btn btn-primary">Volver al Catálogo</a>
    </div>
</div>
